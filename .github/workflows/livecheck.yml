name: brew livecheck

on:
  schedule:
    # Run every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  livecheck:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Configure Git
        uses: Homebrew/actions/git-user-config@main

      - name: Run brew livecheck
        id: livecheck
        run: |
          OUTPUT=$(brew livecheck --cask --formula --newer-only --quiet 2>/dev/null || true)
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$OUTPUT" ]; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
            echo "All casks/formulae are up to date!"
          else
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            echo "Outdated items found:"
            echo "$OUTPUT"
          fi

      - name: Bump outdated casks
        if: steps.livecheck.outputs.outdated == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          echo "${{ steps.livecheck.outputs.output }}" | while IFS= read -r line; do
            cask_name=$(echo "$line" | cut -d: -f1 | xargs)
            new_version=$(echo "$line" | grep -o '==> .*' | awk '{print $2}')

            if [ -n "$cask_name" ] && [ -n "$new_version" ]; then
              echo "Bumping $cask_name to $new_version..."
              brew bump-cask-pr --version "$new_version" --no-browse --no-audit "$cask_name" || \
                echo "Failed to bump $cask_name — may need manual intervention"
            fi
          done

      - name: Summary
        run: |
          if [ "${{ steps.livecheck.outputs.outdated }}" == "true" ]; then
            {
              echo "### 🍺 Homebrew Livecheck Report"
              echo ""
              echo "Outdated casks found and bumped:"
              echo ""
              echo '```'
              echo "${{ steps.livecheck.outputs.output }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ All casks are up to date" >> "$GITHUB_STEP_SUMMARY"
          fi
